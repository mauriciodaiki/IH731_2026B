<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario seguro</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Inventario seguro</h1><p>Cliente local para categorías, productos y movimientos. La clave se conserva únicamente en esta pestaña mientras está abierta.</p><section><label>Clave API <input type="password" id="key" autocomplete="off" placeholder="Clave de .env"></label><button id="load">Consultar inventario</button></section><p id="message" role="status"></p><div class="columns"><section><h2>Categorías</h2><form id="category"><input name="nombre" placeholder="Nombre de categoría" required maxlength="120"><input name="descripcion" placeholder="Descripción"><button>Agregar categoría</button></form><div id="categories"></div></section><section><h2>Productos</h2><form id="product"><input name="nombre" placeholder="Nombre" required><select name="categoria_id" id="cat-select" required></select><input name="precio" type="number" min="0" step="0.01" placeholder="Precio" required><button>Agregar producto</button></form><div id="products"></div></section></div><section><h2>Movimientos</h2><form id="movement"><select name="producto_id" id="prod-select" required></select><select name="tipo"><option>ENTRADA</option><option>SALIDA</option></select><input name="cantidad" type="number" min="1" step="1" placeholder="Cantidad" required><input name="nota" placeholder="Motivo"><button>Registrar movimiento</button></form><div id="movements"></div></section></main><script src="app.js"></script></body></html>
